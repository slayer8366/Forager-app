org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official

# KSP's Analysis API worker loads a large amount of class metadata and exhausted the
# default metaspace on a first run here (OutOfMemoryError: Metaspace in
# KspAAWorkerAction). Stated explicitly rather than left to the default so a build on
# another machine fails the same way or not at all, instead of depending on whatever
# that JDK happens to default to.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp
